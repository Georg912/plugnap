name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please do **not** use
        this form for security vulnerabilities — use
        [private vulnerability reporting](https://github.com/Georg912/plugnap/security/advisories/new)
        instead (Security tab → Report a vulnerability).

  - type: input
    id: device
    attributes:
      label: Device
      description: Model, and whether it's stock Android, GrapheneOS, or another custom ROM.
      placeholder: e.g. Pixel 10 Pro, GrapheneOS
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: e.g. Android 16
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: PlugNap version
      description: Shown at the bottom of the app under "How it works".
      placeholder: e.g. 1.7.0
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set the night window to ...
        2. Plug in the charger at ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logcat
    attributes:
      label: Logcat excerpt (if it's a crash or the mode didn't trigger)
      description: |
        `adb logcat -s PlugNap:* AndroidRuntime:E` while reproducing.
        Please skim it for anything personal before pasting.
      render: shell
