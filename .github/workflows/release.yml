name: Release

# Only fires on a tag push (which only someone with write access to this
# repo can do) — never on pull_request, so a fork's PR can never reach the
# signing secrets below. This is the standard, safe pattern for CI signing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to attach the built APK to the GitHub Release

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      # Reuses the exact signingConfig already in app/build.gradle.kts
      # (it reads these three gradle properties) — no build-script changes
      # needed. The decoded keystore only ever exists on this ephemeral
      # runner's filesystem and is never printed or uploaded anywhere.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p ~/.gradle
          {
            echo "ZENDOCK_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "ZENDOCK_KEYSTORE_PW=$KEYSTORE_PASSWORD"
            echo "ZENDOCK_KEY_ALIAS=zendock"
          } >> ~/.gradle/gradle.properties

      - name: Verify tests still pass before signing a release
        run: ./gradlew test --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify the APK is actually signed
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify "$APK"
          echo "apk_path=$APK" >> "$GITHUB_ENV"

      # Attaches the APK to the release matching this tag. If the release
      # doesn't exist yet, this creates a bare one — the human-written
      # bilingual notes are then added separately via `gh release edit`,
      # same editorial step as before, just decoupled from producing the
      # signed artifact itself.
      - name: Attach APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.apk_path }}
